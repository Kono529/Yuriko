<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Horror Game</title>
  <style>
    body {
      margin: 0;
      font-family: "Yu Gothic", sans-serif;
      background: black;
      color: #ddd;
      overflow-x: hidden;
    }

    /* ノイズ背景 */
    body::before {
      content: "";
      position: fixed;
      width: 100%;
      height: 100%;
      background: url('https://www.transparenttextures.com/patterns/asfalt-dark.png');
      opacity: 0.3;
      z-index: -1;
    }

    header {
      text-align: center;
      padding: 100px 20px;
      letter-spacing: 5px;
      animation: flicker 2s infinite;
    }

    @keyframes flicker {
      0%, 18%, 22%, 25%, 53%, 57%, 100% { opacity: 1; }
      20%, 24%, 55% { opacity: 0.2; }
    }

    h1 {
      font-size: 3em;
      color: #ff2e2e;
    }

    .container {
      max-width: 800px;
      margin: auto;
      padding: 20px;
    }

    .card {
      background: rgba(20,20,20,0.9);
      border: 1px solid #444;
      padding: 20px;
      margin: 20px 0;
      transition: 0.3s;
    }

    .card:hover {
      transform: scale(1.02);
      box-shadow: 0 0 20px red;
    }

    button {
      background: black;
      color: red;
      border: 1px solid red;
      padding: 10px 20px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: red;
      color: black;
    }

    .hidden {
      display: none;
      color: #ff4444;
      margin-top: 10px;
    }

    footer {
      text-align: center;
      padding: 40px;
      font-size: 0.8em;
      opacity: 0.5;
    }
  </style>
</head>
<body>

<header>
  <h1>DON'T LOOK BACK</h1>
  <p>そのページ、本当に開いていいの？</p>
</header>

<div class="container">

  <div class="card">
    <h2>Game Story</h2>
    <p>
      深夜、帰り道。
      誰もいないはずの路地で、足音がついてくる。
      振り返ってはいけない——。
    </p>
  </div>

  <div class="card">
    <h2>Play Demo</h2>
    <button onclick="scare()">起動する</button>
    <div id="scareText" class="hidden">…後ろにいるよ</div>
  </div>

</div>

<footer>
  © Horror Game
</footer>

<script>
  function scare() {
    const text = document.getElementById("scareText");
    text.classList.remove("hidden");

    document.body.style.background = "#100";

    setTimeout(() => {
      alert("振り向いたね？");
    }, 800);
  }

  // マウス追跡で不安演出
  document.addEventListener("mousemove", () => {
    if (Math.random() < 0.01) {
      document.body.style.background = "#200";
      setTimeout(() => {
        document.body.style.background = "black";
      }, 100);
    }
  });
</script>

</body>
</html>
