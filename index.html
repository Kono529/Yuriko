<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Horror Game</title>
<style>
body {
  margin: 0;
  background: black;
  color: #ddd;
  font-family: sans-serif;
  overflow: hidden;
}

#game {
  width: 100vw;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}

#room {
  width: 600px;
  height: 350px;
  background: #111;
  border: 2px solid #333;
  position: relative;
}

.object {
  position: absolute;
  border: 1px solid #555;
  padding: 5px;
  cursor: pointer;
}

#door { bottom: 10px; right: 10px; }
#box { top: 20px; left: 20px; }
#mirror { top: 20px; right: 20px; }

#textBox {
  position: absolute;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,0.8);
  padding: 10px 20px;
  border: 1px solid #444;
}

#moveHint {
  position: absolute;
  top: 10px;
  left: 10px;
  font-size: 12px;
  opacity: 0.5;
}
</style>
</head>
<body>

<div id="game">
  <div id="room">

    <div id="moveHint">WASDキーで移動 / クリックで調べる</div>

    <div id="player" style="width:15px;height:15px;background:red;position:absolute;left:300px;top:180px;"></div>

    <div id="door" class="object">ドア</div>
    <div id="box" class="object">箱</div>
    <div id="mirror" class="object">鏡</div>

  </div>

  <div id="textBox">暗い部屋にいる…</div>
</div>

<script>

const player = document.getElementById('player');
let x = 300;
let y = 180;

// 移動
window.addEventListener('keydown', (e) => {
  if (e.key === 'w') y -= 10;
  if (e.key === 's') y += 10;
  if (e.key === 'a') x -= 10;
  if (e.key === 'd') x += 10;

  player.style.left = x + 'px';
  player.style.top = y + 'px';
});

// テキスト表示
function showText(msg) {
  document.getElementById('textBox').innerText = msg;
}

// オブジェクト調べる

document.getElementById('box').onclick = () => {
  showText('中は空っぽ…いや、何か動いた？');
};

let mirrorCount = 0;
document.getElementById('mirror').onclick = () => {
  mirrorCount++;
  if (mirrorCount === 1) showText('自分の顔が映っている…');
  else if (mirrorCount === 2) showText('一瞬、後ろに誰か…');
  else showText('もう見たくない。');
};


document.getElementById('door').onclick = () => {
  if (Math.random() < 0.5) {
    showText('ドアは開かない…');
  } else {
    showText('ドアが開いた。外は暗い。');
  }
};

// 不安演出
setInterval(() => {
  if (Math.random() < 0.1) {
    document.body.style.background = '#200';
    setTimeout(() => document.body.style.background = 'black', 100);
  }
}, 1000);

</script>

</body>
</html>
