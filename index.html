<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>3D風ホラー</title>
<style>
body {
  margin: 0;
  overflow: hidden;
  background: black;
}
canvas { display: block; }
#text {
  position: absolute;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  color: white;
  background: rgba(0,0,0,0.7);
  padding: 10px;
  font-size: 14px;
}
</style>
</head>
<body>
<div id="text">WASDで移動 / マウスで視点</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.158/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.158/examples/js/controls/PointerLockControls.js"></script>

<script>
// シーン
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);

// カメラ
const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);

// レンダラー
const renderer = new THREE.WebGLRenderer();
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// コントロール（FPS視点）
const controls = new THREE.PointerLockControls(camera, document.body);
document.body.addEventListener('click', () => controls.lock());

// ライト
const light = new THREE.PointLight(0xffffff, 1, 10);
light.position.set(0,2,0);
scene.add(light);

// 床
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(20,20),
  new THREE.MeshBasicMaterial({color: 0x111111})
);
floor.rotation.x = -Math.PI/2;
scene.add(floor);

// 壁
function createWall(x,z) {
  const wall = new THREE.Mesh(
    new THREE.BoxGeometry(1,2,1),
    new THREE.MeshBasicMaterial({color: 0x222222})
  );
  wall.position.set(x,1,z);
  scene.add(wall);
}

for(let i=-10;i<10;i++){
  createWall(i,-10);
  createWall(i,10);
  createWall(-10,i);
  createWall(10,i);
}

// オブジェクト（怖いポイント）
const box = new THREE.Mesh(
  new THREE.BoxGeometry(1,1,1),
  new THREE.MeshBasicMaterial({color: 0x550000})
);
box.position.set(2,0.5,-3);
scene.add(box);

// カメラ初期位置
camera.position.set(0,1.6,5);

// 移動
const keys = {};
document.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
document.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

function move(){
  const speed = 0.05;
  if(keys['w']) controls.moveForward(speed);
  if(keys['s']) controls.moveForward(-speed);
  if(keys['a']) controls.moveRight(-speed);
  if(keys['d']) controls.moveRight(speed);
}

// 距離でイベント
function checkEvents(){
  const dist = camera.position.distanceTo(box.position);
  if(dist < 2){
    document.getElementById('text').innerText = '箱がある…開ける？（自動）';
    if(Math.random()<0.01){
      document.body.style.background = '#200';
      setTimeout(()=>document.body.style.background='black',100);
    }
  }
}

// ループ
function animate(){
  requestAnimationFrame(animate);
  move();
  checkEvents();
  renderer.render(scene,camera);
}
animate();

</script>
</body>
</html>
