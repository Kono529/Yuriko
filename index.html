<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>恋のムズムズ！〜君は僕の抗原〜</title>
    <style>
        body { background-color: #fdf5e6; font-family: 'Hiragino Kaku Gothic ProN', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        #game-container { background: white; width: 600px; padding: 20px; border-radius: 15px; box-shadow: 0 0 20px rgba(0,0,0,0.1); border: 3px solid #ffd700; }
        #status { font-size: 0.9em; color: #666; margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        #message { height: 120px; font-size: 1.1em; line-height: 1.6; margin-bottom: 20px; }
        .buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        button { padding: 10px; cursor: pointer; border: 1px solid #ffd700; background: #fffdf0; border-radius: 5px; transition: 0.2s; }
        button:hover { background: #ffd700; color: white; }
        #meter-container { height: 10px; background: #eee; border-radius: 5px; margin-top: 10px; overflow: hidden; }
        #meter-fill { height: 100%; background: #ff69b4; width: 50%; transition: width 0.5s; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="status">場所: 教室 | 杉山くんの好感度</div>
    <div id="meter-container"><div id="meter-fill"></div></div>
    <div id="message"></div>
    <div class="buttons" id="btn-group"></div>
</div>

<script>
    let loveMeter = 50;
    const messageEl = document.getElementById('message');
    const btnGroup = document.getElementById('btn-group');
    const meterFill = document.getElementById('meter-fill');

    const scenes = {
        start: {
            text: "「……なんだよ。僕に近づくと、涙が止まらなくなるよ？」<br>目の前にはスギ花粉の擬人化、杉山くんが立っている。",
            options: [
                { text: "「それでも一緒にいたいの」", next: "talk_love" },
                { text: "「点眼薬持ってるから大丈夫！」", next: "talk_reject" },
                { text: "窓を全開にする", next: "action_window" },
                { text: "辺りを調べる", next: "search" }
            ]
        },
        talk_love: {
            text: "杉山「……馬鹿だな、君は。……でも、悪くない気分だ」<br>彼は少し頬を染め、黄色い粉を少しだけ多めに舞わせた。",
            change: 20,
            options: [{ text: "次へ", next: "start" }]
        },
        talk_reject: {
            text: "杉山「ふん、重装備だな。僕を拒絶するつもりか？ 興ざめだよ」<br>彼は冷たい目をして、風の吹く方へ視線を逸らした。",
            change: -15,
            options: [{ text: "次へ", next: "start" }]
        },
        search: {
            text: "彼の周りには常に黄色い粒子がキラキラと舞っている。机の上には予備のティッシュが山積みだ。",
            change: 5,
            options: [{ text: "次へ", next: "start" }]
        },
        action_window: {
            text: "窓を全開にした！ 春一番が吹き込み、杉山くんの輝きが増す。<br>杉山「最高の気分だ！ 街中を僕の色に染めてやるよ！」",
            change: 25,
            options: [{ text: "次へ", next: "start" }]
        }
    };

    function updateDisplay(sceneKey) {
        const scene = scenes[sceneKey];
        if (scene.change) {
            loveMeter = Math.max(0, Math.min(100, loveMeter + scene.change));
            meterFill.style.width = loveMeter + "%";
        }

        messageEl.innerHTML = scene.text;
        btnGroup.innerHTML = '';

        if (loveMeter >= 100) {
            messageEl.innerHTML = "★★★ HAPPY END ★★★<br>杉山「もう離さない。君の粘膜すべてに、僕を刻み込んであげる……」";
            return;
        } else if (loveMeter <= 0) {
            messageEl.innerHTML = "××× BAD END ×××<br>杉山「君からは拒絶の匂いがする。……来年までさよならだ」";
            return;
        }

        scene.options.forEach(opt => {
            const btn = document.createElement('button');
            btn.innerText = opt.text;
            btn.onclick = () => updateDisplay(opt.next);
            btnGroup.appendChild(btn);
        });
    }

    // ゲーム開始
    updateDisplay('start');
</script>
</body>
</html>
